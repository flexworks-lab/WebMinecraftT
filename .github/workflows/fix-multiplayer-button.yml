name: Apply Multiplayer Fix

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix multiplayer button') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch client
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.js')
          text = path.read_text()

          old = 'const playButton = document.getElementById("playButton");\n'
          new = old + 'const multiplayerButton = document.getElementById("multiplayerButton");\n'
          if 'const multiplayerButton = document.getElementById("multiplayerButton");' not in text:
              if old not in text:
                  raise SystemExit('playButton anchor not found')
              text = text.replace(old, new, 1)

          old = 'if (openSeedButton) openSeedButton.addEventListener("click", event => {\n'
          new = '''if (multiplayerButton) multiplayerButton.addEventListener("click", async event => {\n    event.preventDefault(); event.stopPropagation();\n    try {\n        const { openMultiplayerMenu } = await import("./multiplayerClient.js");\n        openMultiplayerMenu();\n    } catch (error) {\n        console.error("Failed to open multiplayer menu:", error);\n    }\n});\n''' + old
          if 'await import("./multiplayerClient.js")' not in text:
              if old not in text:
                  raise SystemExit('openSeedButton anchor not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Ensure multiplayer server dependency
        run: npm install ws@^8.18.3 --save --package-lock-only

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix multiplayer button"
          git push
