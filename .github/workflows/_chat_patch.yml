name: Add multiplayer chat
on:
  push:
    paths:
      - .github/workflows/_chat_patch.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat
        shell: python
        run: |
          from pathlib import Path
          import re

          # Server: chat sanitation + broadcast + join/leave notices.
          server = Path('server/server.js')
          s = server.read_text()
          if 'function sanitizeChat' not in s:
              marker = 'function numberOr(value, fallback = 0) {'
              helper = '''function sanitizeChat(value) {
                  return String(value ?? "")
                      .replace(/[<>]/g, "")
                      .replace(/[\\r\\n]+/g, " ")
                      .trim()
                      .slice(0, 120);
              }

              function numberOr(value, fallback = 0) {'''
              if marker not in s:
                  raise SystemExit('server sanitize marker not found')
              s = s.replace(marker, helper, 1)

          join_marker = '        broadcast(room, { type: "player_joined", player: publicPlayer(player) }, player.id);'
          if 'has joined the server' not in s:
              if join_marker not in s:
                  raise SystemExit('server join broadcast marker not found')
              s = s.replace(join_marker, join_marker + '\n        broadcast(room, { type: "chat_system", text: `${player.name} has joined the server` });', 1)

          chat_marker = '    if (message.type === "block_change") {'
          if 'message.type === "chat_message"' not in s:
              chat_block = '''    if (message.type === "chat_message") {
                  const room = rooms.get(player.room);
                  if (!room) return;
                  const text = sanitizeChat(message.text);
                  if (!text) return;
                  broadcast(room, {
                      type: "chat_message",
                      playerId: player.id,
                      name: player.name,
                      text,
                  });
                  return;
              }

    if (message.type === "block_change") {'''
              if chat_marker not in s:
                  raise SystemExit('server chat insertion marker not found')
              s = s.replace(chat_marker, chat_block, 1)

          leave_marker = '        broadcast(room, { type: "player_left", playerId: player.id });'
          if 'has left the server' not in s:
              if leave_marker not in s:
                  raise SystemExit('server leave marker not found')
              s = s.replace(leave_marker, '        broadcast(room, { type: "chat_system", text: `${player.name} has left the server` });\n' + leave_marker, 1)

          server.write_text(s)

          # Client: top-left chat UI, input, Enter/T shortcut, and incoming messages.
          client = Path('src/multiplayerClient.js')
          c = client.read_text()
          if 'function ensureChatUI()' not in c:
              marker = 'function makeStyle() {'
              chat = '''function ensureChatUI() {
                  if (document.getElementById("multiplayerChat")) return;

                  const style = document.createElement("style");
                  style.id = "multiplayerChatStyles";
                  style.textContent = `
                      #multiplayerChat{position:fixed;top:12px;left:12px;width:min(380px,calc(100vw - 24px));z-index:180;display:none;font-family:Arial,sans-serif;pointer-events:none;text-shadow:1px 1px 2px #000}
                      #multiplayerChatFeed{box-sizing:border-box;max-height:230px;overflow-y:auto;padding:8px 9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.16);scrollbar-width:thin}
                      .multiplayerChatLine{font-size:13px;line-height:1.4;color:#fff;overflow-wrap:anywhere;margin:2px 0}
                      .multiplayerChatSystem{color:#bdbdbd;font-style:italic}
                      .multiplayerChatName{font-weight:700}
                      #multiplayerChatInput{box-sizing:border-box;width:100%;height:34px;margin-top:6px;padding:6px 9px;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.2);outline:none;pointer-events:auto;font:13px Arial,sans-serif}
                      #multiplayerChatInput::placeholder{color:#aaa}
                  `;
                  document.head.appendChild(style);

                  const chat = document.createElement("div");
                  chat.id = "multiplayerChat";
                  chat.innerHTML = `
                      <div id="multiplayerChatFeed" aria-live="polite"></div>
                      <input id="multiplayerChatInput" maxlength="120" autocomplete="off" placeholder="Press Enter to chat...">
                  `;
                  document.body.appendChild(chat);

                  const feed = chat.querySelector("#multiplayerChatFeed");
                  const input = chat.querySelector("#multiplayerChatInput");
                  window.__webminecraftChatAdd = (text, system = false, name = "") => {
                      const line = document.createElement("div");
                      line.className = `multiplayerChatLine${system ? " multiplayerChatSystem" : ""}`;
                      if (system) {
                          line.textContent = text;
                      } else {
                          const label = document.createElement("span");
                          label.className = "multiplayerChatName";
                          label.textContent = `${name}: `;
                          line.appendChild(label);
                          line.appendChild(document.createTextNode(text));
                      }
                      feed.appendChild(line);
                      while (feed.children.length > 30) feed.firstElementChild.remove();
                      feed.scrollTop = feed.scrollHeight;
                  };

                  window.__webminecraftChatShow = () => { chat.style.display = "block"; };
                  window.__webminecraftChatHide = () => { chat.style.display = "none"; input.blur(); };

                  input.addEventListener("keydown", event => {
                      event.stopPropagation();
                      if (event.key === "Enter") {
                          const text = input.value.trim();
                          if (text && isMultiplayerActive()) {
                              try { socket.send(JSON.stringify({ type: "chat_message", text })); } catch {}
                          }
                          input.value = "";
                          input.blur();
                          event.preventDefault();
                      } else if (event.key === "Escape") {
                          input.value = "";
                          input.blur();
                          event.preventDefault();
                      }
                  });
              }

              function openChatInput() {
                  if (!isMultiplayerActive()) return;
                  ensureChatUI();
                  const input = document.getElementById("multiplayerChatInput");
                  if (!input) return;
                  window.__webminecraftChatShow?.();
                  input.focus();
              }

              function makeStyle() {'''
              if marker not in c:
                  raise SystemExit('client style marker not found')
              c = c.replace(marker, chat, 1)

          # Show chat once the player joins multiplayer.
          joined_marker = '                joinButton.textContent = "Connected";'
          if 'window.__webminecraftChatShow?.();' not in c:
              if joined_marker not in c:
                  raise SystemExit('client joined marker not found')
              c = c.replace(joined_marker, '                ensureChatUI();\n                window.__webminecraftChatShow?.();\n                window.__webminecraftChatAdd?.("Connected to the server.", true);\n' + joined_marker, 1)

          # Handle incoming server/system/player chat.
          handler_marker = '            } else if (message.type === "player_joined") {'
          if 'message.type === "chat_system"' not in c:
              chat_handlers = '''            } else if (message.type === "chat_system") {
                ensureChatUI();
                window.__webminecraftChatShow?.();
                window.__webminecraftChatAdd?.(String(message.text || ""), true);
            } else if (message.type === "chat_message") {
                ensureChatUI();
                window.__webminecraftChatShow?.();
                window.__webminecraftChatAdd?.(String(message.text || ""), false, String(message.name || "Player"));
            } else if (message.type === "player_joined") {'''
              if handler_marker not in c:
                  raise SystemExit('client chat handler marker not found')
              c = c.replace(handler_marker, chat_handlers, 1)

          # Hide chat when multiplayer connection/menu closes.
          close_marker = '        window.__webminecraftMultiplayerPlayerId = null;'
          if 'window.__webminecraftChatHide?.();' not in c:
              if close_marker not in c:
                  raise SystemExit('client close marker not found')
              c = c.replace(close_marker, close_marker + '\n        window.__webminecraftChatHide?.();', 1)

          # Keyboard shortcut.
          beforeunload_marker = '    window.addEventListener("beforeunload", () => {'
          if 'openChatInput();' not in c:
              shortcut = '''    window.addEventListener("keydown", event => {
        if ((event.key === "Enter" || event.key.toLowerCase() === "t") && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
            if (isMultiplayerActive()) {
                event.preventDefault();
                openChatInput();
            }
        }
    });

    window.addEventListener("beforeunload", () => {'''
              if beforeunload_marker not in c:
                  raise SystemExit('client keyboard insertion marker not found')
              c = c.replace(beforeunload_marker, shortcut, 1)

          client.write_text(c)
          print('chat patched')

      - name: Build and commit
        shell: bash
        run: |
          set -e
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_chat_patch.yml .github/workflows/_fix_live_client.yml .github/workflows/_fix_live_client2.yml .github/workflows/_live_world_sync.yml .github/workflows/_reconcile_world.yml
          git add server/server.js src/multiplayerClient.js .github/workflows
          git commit -m "FEAT: Add multiplayer chat"
          git push
