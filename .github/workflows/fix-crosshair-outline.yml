name: Apply door rework

'on':
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-crosshair-outline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Rework door system') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Apply door files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          world_path = Path('src/world.js')
          world = world_path.read_text()
          if 'OAK_DOOR: 17' not in world:
              world = world.replace('TNT: 15, BRICKS: 18,', 'TNT: 15, OAK_DOOR: 17, BRICKS: 18,', 1)
          world = world.replace('function isSolid(type){return type!==BLOCK.AIR;}', 'function isSolid(type){return type!==BLOCK.AIR&&type!==BLOCK.OAK_DOOR;}', 1)
          world_path.write_text(world)
          Path('src/door.js').write_text(Path('.github/door_rework.js').read_text())
          PY

      - name: Build
        run: npm install --ignore-scripts --no-audit --no-fund && node ./node_modules/vite/bin/vite.js build

      - name: Commit final door rework
        run: |
          rm -f .github/door_rework.js .github/workflows/apply-door-fix.yml .door-fix-trigger
          git checkout HEAD^ -- .github/workflows/fix-crosshair-outline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rework door system"
          git push origin main
