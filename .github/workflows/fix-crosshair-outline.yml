name: Add crosshair and block-facing outline

on:
  push:
    branches: ["main"]
    paths:
      - 'src/interaction.js'
      - '.github/workflows/fix-crosshair-outline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Rework door system')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch interaction UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/interaction.js')
          s = p.read_text()

          old_setup = '''    const outline = createSelectionOutline();
    scene.add(outline);'''
          new_setup = '''    const outline = createSelectionOutline();
    scene.add(outline);
    const crosshair = createCrosshair();
    document.body.appendChild(crosshair);'''
          if 'const crosshair = createCrosshair();' not in s:
              if old_setup not in s:
                  raise SystemExit('Could not find selection outline setup')
              s = s.replace(old_setup, new_setup, 1)

          old_outline = '''function createSelectionOutline() {
    const geometry = new THREE.BoxGeometry(1.02, 1.02, 1.02);
    const material = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.95, depthTest: false });
    const outline = new THREE.Mesh(geometry, material);
    outline.visible = false;
    outline.renderOrder = 1000;
    return outline;
}'''

          new_outline = '''function createCrosshair() {
    let crosshair = document.getElementById('webMinecraftCrosshair');
    if (crosshair) return crosshair;
    crosshair = document.createElement('div');
    crosshair.id = 'webMinecraftCrosshair';
    crosshair.setAttribute('aria-hidden', 'true');
    crosshair.innerHTML = '<span></span><span></span>';
    crosshair.style.cssText = 'position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;z-index:9999;display:none;';
    const style = document.createElement('style');
    style.id = 'webMinecraftCrosshairStyles';
    style.textContent = `
        #webMinecraftCrosshair span { position:absolute; display:block; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.8); }
        #webMinecraftCrosshair span:first-child { left:1px; right:1px; top:8px; height:2px; }
        #webMinecraftCrosshair span:last-child { top:1px; bottom:1px; left:8px; width:2px; }
        body.webminecraft-in-world #webMinecraftCrosshair { display:block; }
        body:not(.webminecraft-in-world) #webMinecraftCrosshair { display:none; }
    `;
    document.head.appendChild(style);
    return crosshair;
}

function createSelectionOutline() {
    const outline = new THREE.LineSegments(
        new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.95, depthTest: false })
    );
    outline.visible = false;
    outline.renderOrder = 1000;
    return outline;
}

function updateSelectionOutline(outline, target, camera) {
    const center = new THREE.Vector3(target.x, target.y, target.z);
    const toCamera = camera.position.clone().sub(center);
    const distance = toCamera.length();
    if (distance < 0.0001) return;
    toCamera.multiplyScalar(1 / distance);
    const min = -0.511;
    const max = 0.511;
    const faces = [
        { n: new THREE.Vector3( 1, 0, 0), c: [[max,min,min],[max,max,min],[max,max,max],[max,min,max]] },
        { n: new THREE.Vector3(-1, 0, 0), c: [[min,min,max],[min,max,max],[min,max,min],[min,min,min]] },
        { n: new THREE.Vector3( 0, 1, 0), c: [[min,max,min],[min,max,max],[max,max,max],[max,max,min]] },
        { n: new THREE.Vector3( 0,-1, 0), c: [[min,min,max],[min,min,min],[max,min,min],[max,min,max]] },
        { n: new THREE.Vector3( 0, 0, 1), c: [[max,min,max],[max,max,max],[min,max,max],[min,min,max]] },
        { n: new THREE.Vector3( 0, 0,-1), c: [[min,min,min],[min,max,min],[max,max,min],[max,min,min]] }
    ];
    const positions = [];
    const addEdge = (a, b) => positions.push(a[0],a[1],a[2],b[0],b[1],b[2]);
    for (const face of faces) {
        if (face.n.dot(toCamera) <= 0.08) continue;
        const c = face.c.map(v => [v[0]+center.x,v[1]+center.y,v[2]+center.z]);
        addEdge(c[0],c[1]); addEdge(c[1],c[2]); addEdge(c[2],c[3]); addEdge(c[3],c[0]);
    }
    outline.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    outline.geometry.computeBoundingSphere();
}'''

          if old_outline in s:
              s = s.replace(old_outline, new_outline, 1)
          elif 'function updateSelectionOutline(outline, target, camera)' not in s:
              raise SystemExit('Could not find selection outline function')

          old_update = '''        if (!target) outline.visible = false;
        else { outline.position.set(target.x, target.y, target.z); outline.visible = true; }'''
          new_update = '''        if (!target) {
            outline.visible = false;
        } else {
            outline.position.set(0, 0, 0);
            updateSelectionOutline(outline, target, camera);
            outline.visible = true;
        }'''
          if old_update in s:
              s = s.replace(old_update, new_update, 1)

          p.write_text(s)
          PY

      - name: Rework door system
        run: |
          python - <<'PY'
          from pathlib import Path

          world_path = Path('src/world.js')
          world = world_path.read_text()
          if 'OAK_DOOR: 17' not in world:
              old = 'TNT: 15, BRICKS: 18,'
              new = 'TNT: 15, OAK_DOOR: 17, BRICKS: 18,'
              if old not in world:
                  raise SystemExit('Could not add door block id')
              world = world.replace(old, new, 1)
          world = world.replace(
              'function isSolid(type){return type!==BLOCK.AIR;}',
              'function isSolid(type){return type!==BLOCK.AIR&&type!==BLOCK.OAK_DOOR;}',
              1
          )
          world_path.write_text(world)

          door_path = Path('src/door.js')
          door = door_path.read_text()

          door = door.replace(
              'const BLOCK = getBlockTypes();\n\nfunction key(x, y, z) { return `${x},${y},${z}`; }',
              '''const BLOCK = getBlockTypes();
          const DOOR_BLOCK = BLOCK.OAK_DOOR ?? 17;
          const DOOR_SCAN_RADIUS = 14;
          const DOOR_SCAN_MIN_Y = -3;
          const DOOR_SCAN_MAX_Y = 4;
          let lastDoorScan = 0;

          function key(x, y, z) { return `${x},${y},${z}`; }''',
              1
          )

          old_mesh = '''function createDoorMesh(x, y, z, facing = "z") {
    const group = new THREE.Group();
    group.position.set(x, y, z);
    group.userData.isDoor = true;
    group.userData.doorBase = { x, y, z };
    group.userData.open = false;
    group.userData.facing = facing;

    const bottom = new THREE.Mesh(
        new THREE.BoxGeometry(0.86, 1, 0.10),
        new THREE.MeshPhongMaterial({ map: DOOR_TEXTURE, color: 0xffffff, side: THREE.DoubleSide })
    );
    const top = new THREE.Mesh(
        new THREE.BoxGeometry(0.86, 1, 0.10),
        new THREE.MeshPhongMaterial({ map: DOOR_TOP_TEXTURE, color: 0xffffff, side: THREE.DoubleSide })
    );
    bottom.position.y = 0.5;
    top.position.y = 1.5;
    for (const part of [bottom, top]) {
        part.userData.isDoor = true;
        part.userData.doorBase = { x, y, z };
    }
    group.add(bottom, top);
    if (facing === "x") group.rotation.y = Math.PI / 2;
    scene.add(group);
    doors.set(key(x, y, z), group);
    return group;
}'''

          new_mesh = '''function createDoorMesh(x, y, z, facing = "z", openAngle = 0) {
    const group = new THREE.Group();
    const hinge = facing === "x" ? new THREE.Vector3(x, y, z + 0.43) : new THREE.Vector3(x - 0.43, y, z);
    group.position.copy(hinge);
    group.rotation.y = facing === "x" ? Math.PI / 2 : 0;
    group.userData.isDoor = true;
    group.userData.doorBase = { x, y, z };
    group.userData.open = openAngle !== 0;
    group.userData.openAngle = openAngle;
    group.userData.facing = facing;

    const panel = new THREE.Group();
    panel.rotation.y = openAngle;
    const bottom = new THREE.Mesh(
        new THREE.BoxGeometry(0.86, 1, 0.10),
        new THREE.MeshPhongMaterial({ map: DOOR_TEXTURE, color: 0xffffff, side: THREE.DoubleSide })
    );
    const top = new THREE.Mesh(
        new THREE.BoxGeometry(0.86, 1, 0.10),
        new THREE.MeshPhongMaterial({ map: DOOR_TOP_TEXTURE, color: 0xffffff, side: THREE.DoubleSide })
    );
    bottom.position.set(0.43, 0.5, 0);
    top.position.set(0.43, 1.5, 0);
    for (const part of [bottom, top]) {
        part.userData.isDoor = true;
        part.userData.doorBase = { x, y, z };
        panel.add(part);
    }
    group.add(panel);
    scene.add(group);
    doors.set(key(x, y, z), group);
    return group;
}'''
          if old_mesh not in door:
              raise SystemExit('Could not find old door mesh')
          door = door.replace(old_mesh, new_mesh, 1)

          old_collision = '''function syncDoorCollision(door, open) {
    const { x, y, z } = door.userData.doorBase;
    if (open) {
        setBlockAt(x, y, z, BLOCK.AIR);
        setBlockAt(x, y + 1, z, BLOCK.AIR);
    } else {
        if (getBlockAt(x, y, z) !== BLOCK.AIR || getBlockAt(x, y + 1, z) !== BLOCK.AIR) return false;
        setBlockAt(x, y, z, BLOCK.OAK_PLANKS);
        setBlockAt(x, y + 1, z, BLOCK.OAK_PLANKS);
    }
    return true;
}

function toggleDoor(door) {
    if (!door) return false;
    const nextOpen = !door.userData.open;
    if (!syncDoorCollision(door, nextOpen)) return false;
    door.userData.open = nextOpen;
    door.rotation.y = nextOpen
        ? (door.userData.facing === "x" ? -Math.PI / 2 : Math.PI / 2)
        : (door.userData.facing === "x" ? Math.PI / 2 : 0);
    return true;
}'''

          new_collision = '''function syncDoorCollision(door, open) {
    const { x, y, z } = door.userData.doorBase;
    if (open) {
        setBlockAt(x, y, z, BLOCK.AIR);
        setBlockAt(x, y + 1, z, BLOCK.AIR);
        return true;
    }
    if (getBlockAt(x, y, z) !== BLOCK.AIR || getBlockAt(x, y + 1, z) !== BLOCK.AIR) return false;
    return setBlockAt(x, y, z, DOOR_BLOCK) && setBlockAt(x, y + 1, z, DOOR_BLOCK);
}

function toggleDoor(door) {
    if (!door) return false;
    const nextOpen = !door.userData.open;
    if (!syncDoorCollision(door, nextOpen)) return false;
    door.userData.open = nextOpen;
    const side = door.userData.facing === "x" ? camera.position.x - door.userData.doorBase.x : camera.position.z - door.userData.doorBase.z;
    door.userData.openAngle = nextOpen ? (side >= 0 ? Math.PI / 2 : -Math.PI / 2) : 0;
    const panel = door.children[0];
    if (panel) panel.rotation.y = door.userData.openAngle;
    return true;
}'''
          if old_collision not in door:
              raise SystemExit('Could not find old door collision')
          door = door.replace(old_collision, new_collision, 1)

          marker = '''function getDoorTarget() {
    if (!scene || !camera) return null;'''
          reconcile = '''function inferDoorFacing(x, y, z) {
    const xSide = getBlockAt(x - 1, y, z) !== BLOCK.AIR || getBlockAt(x + 1, y, z) !== BLOCK.AIR;
    const zSide = getBlockAt(x, y, z - 1) !== BLOCK.AIR || getBlockAt(x, y, z + 1) !== BLOCK.AIR;
    if (xSide && !zSide) return "z";
    if (zSide && !xSide) return "x";
    return "z";
}

function reconcileDoors(force = false) {
    if (!scene || !camera) return;
    const now = performance.now();
    if (!force && now - lastDoorScan < 400) return;
    lastDoorScan = now;
    const cx = Math.floor(camera.position.x), cy = Math.floor(camera.position.y - 1), cz = Math.floor(camera.position.z);
    const wanted = new Set();
    for (let x = cx - DOOR_SCAN_RADIUS; x <= cx + DOOR_SCAN_RADIUS; x++) {
        for (let z = cz - DOOR_SCAN_RADIUS; z <= cz + DOOR_SCAN_RADIUS; z++) {
            for (let y = cy + DOOR_SCAN_MIN_Y; y <= cy + DOOR_SCAN_MAX_Y; y++) {
                if (getBlockAt(x, y, z) !== DOOR_BLOCK || getBlockAt(x, y + 1, z) !== DOOR_BLOCK) continue;
                if (getBlockAt(x, y - 1, z) === DOOR_BLOCK) continue;
                const k = key(x, y, z);
                wanted.add(k);
                if (!doors.has(k)) createDoorMesh(x, y, z, inferDoorFacing(x, y, z));
            }
        }
    }
    for (const [k, door] of doors) {
        const base = door.userData.doorBase;
        const far = Math.max(Math.abs(base.x - cx), Math.abs(base.z - cz));
        if (!door.userData.open && (far > DOOR_SCAN_RADIUS + 3 || !wanted.has(k) && (getBlockAt(base.x, base.y, base.z) !== DOOR_BLOCK || getBlockAt(base.x, base.y + 1, base.z) !== DOOR_BLOCK))) {
            removeDoorMesh(base.x, base.y, base.z);
        }
    }
}

function getDoorTarget() {
    if (!scene || !camera) return null;
    reconcileDoors(true);'''
          if marker not in door:
              raise SystemExit('Could not find door target function')
          door = door.replace(marker, reconcile, 1)

          door = door.replace(
              '    document.addEventListener("webminecraft:doordisplay", () => {});\n    updateHeldDoor();',
              '    document.addEventListener("webminecraft:doordisplay", () => {});\n    updateHeldDoor();\n    reconcileDoors(true);',
              1
          )

          old_place = '''    const facing = Math.abs(normal.x) > Math.abs(normal.z) ? "x" : "z";
    const door = createDoorMesh(x, y, z, facing);
    if (!setBlockAt(x, y, z, BLOCK.OAK_PLANKS) || !setBlockAt(x, y + 1, z, BLOCK.OAK_PLANKS)) {
        removeDoorMesh(x, y, z);
        return false;
    }'''
          new_place = '''    const facing = Math.abs(normal.x) > Math.abs(normal.z) ? "x" : "z";
    if (!setBlockAt(x, y, z, DOOR_BLOCK)) return false;
    if (!setBlockAt(x, y + 1, z, DOOR_BLOCK)) {
        setBlockAt(x, y, z, BLOCK.AIR);
        return false;
    }
    const door = createDoorMesh(x, y, z, facing);'''
          if old_place not in door:
              raise SystemExit('Could not find old door placement')
          door = door.replace(old_place, new_place, 1)

          door_path.write_text(door)
          PY

      - name: Build site
        run: npm install --ignore-scripts --no-audit --no-fund && node ./node_modules/vite/bin/vite.js build

      - name: Commit door rework and cleanup
        run: |
          rm -f .github/workflows/apply-door-fix.yml .door-fix-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rework door system'
          git push origin main
