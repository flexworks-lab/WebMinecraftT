name: Door rework runner

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-crosshair-outline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Rework door collision')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Patch door behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          door_path = Path('src/door.js')
          door = door_path.read_text()
          if 'const openDoorStates = new Map();' not in door:
              door = door.replace('const doors = new Map();\nconst BLOCK = getBlockTypes();', 'const doors = new Map();\nconst openDoorStates = new Map();\nconst BLOCK = getBlockTypes();', 1)

          door = door.replace(
              '    group.userData.open = openAngle !== 0;\n    group.userData.openAngle = openAngle;',
              '    const preservedAngle = openAngle || openDoorStates.get(key(x, y, z)) || 0;\n    group.userData.open = preservedAngle !== 0;\n    group.userData.openAngle = preservedAngle;',
              1
          )
          door = door.replace('    panel.rotation.y = openAngle;', '    panel.rotation.y = preservedAngle;', 1)

          start = door.find('function updateDoorCollisionState(door) {')
          end = door.find('function getDoorFromObject(object) {')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('door toggle section not found')
          replacement = '''function updateDoorCollisionState(door) {\n    if (!door) return false;\n    const { x, y, z } = door.userData.doorBase;\n    const k = key(x, y, z);\n    if (door.userData.open) openDoorStates.set(k, door.userData.openAngle || Math.PI / 2);\n    else openDoorStates.delete(k);\n    return true;\n}\n\nfunction toggleDoor(door) {\n    if (!door) return false;\n    const { x, z } = door.userData.doorBase;\n    if (door.userData.open) {\n        door.userData.open = false;\n        door.userData.openAngle = 0;\n    } else {\n        const side = door.userData.facing === 'x' ? camera.position.x - x : camera.position.z - z;\n        door.userData.open = true;\n        door.userData.openAngle = side >= 0 ? Math.PI / 2 : -Math.PI / 2;\n    }\n    updateDoorCollisionState(door);\n    const panel = door.children[0];\n    if (panel) panel.rotation.y = door.userData.openAngle;\n    return true;\n}\n\nexport function isDoorBlocking(x, y, z) {\n    return !openDoorStates.has(key(x, y, z));\n}\n\n'''
          door = door[:start] + replacement + door[end:]

          door = door.replace(
              '    if (action === "break") {\n        const { x, y, z } = target;',
              '    if (action === "break") {\n        const { x, y, z } = target;\n        openDoorStates.delete(key(x, y, z));',
              1
          )
          door = door.replace(
              '    const facing = Math.abs(normal.x) > Math.abs(normal.z) ? "x" : "z";\n    if (!setBlockAt(x, y, z, DOOR_BLOCK)) return false;',
              '    const facing = Math.abs(normal.x) > Math.abs(normal.z) ? "x" : "z";\n    openDoorStates.delete(key(x, y, z));\n    if (!setBlockAt(x, y, z, DOOR_BLOCK)) return false;',
              1
          )
          door_path.write_text(door)

          player_path = Path('src/player.js')
          player = player_path.read_text()
          if 'import { isDoorBlocking } from "./door.js";' not in player:
              player = player.replace('import { getBlockAt } from "./world.js";\n', 'import { getBlockAt } from "./world.js";\nimport { isDoorBlocking } from "./door.js";\n', 1)
          player = player.replace(
              'function blockExists(x, y, z) {\n    return !!getBlockAt(x, y, z);\n}',
              '''function blockExists(x, y, z) {\n    const type = getBlockAt(x, y, z);\n    if (!type) return false;\n    if (type === 17) return isDoorBlocking(x, y, z);\n    return true;\n}''',
              1
          )
          player_path.write_text(player)
          PY

      - name: Build
        run: npm install --ignore-scripts --no-audit --no-fund && node ./node_modules/vite/bin/vite.js build

      - name: Commit door fix and restore workflow
        run: |
          rm -f .github/workflows/door-runtime-fix.yml .github/workflows/apply-door-fix.yml .door-fix-trigger .github/door_rework.js
          git checkout HEAD^ -- .github/workflows/fix-crosshair-outline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rework door collision'
          git push origin main
