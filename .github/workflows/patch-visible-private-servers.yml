name: Patch Visible Private Servers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch private server visibility and join flow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const serverPath = 'server/server.js';
          let server = fs.readFileSync(serverPath, 'utf8');
          const serverReplacements = [
            ['        maxPlayers: MAX_PLAYERS_PER_SERVER,\n        worldSeed: room.worldSeed,','        maxPlayers: MAX_PLAYERS_PER_SERVER,\n        private: Boolean(room.isPrivate),\n        worldSeed: room.worldSeed,'],
            ['rooms: [...rooms.values()].filter(room => !room.isPrivate).map(publicRoom),','rooms: [...rooms.values()].map(publicRoom),']
          ];
          for (const [from,to] of serverReplacements) { if (!server.includes(from)) throw new Error(`server replacement not found: ${from}`); server = server.replace(from,to); }
          fs.writeFileSync(serverPath, server);

          const clientPath = 'src/multiplayerClient.js';
          let client = fs.readFileSync(clientPath, 'utf8');
          const clientReplacements = [
            ['Choose PUBLIC to appear in the server list, or PRIVATE to keep your server hidden.','PRIVATE servers are visible in the list, but require a private code to join.'],
            ['<div class="${full ? "multiplayerOffline" : "multiplayerOnline"}">${full ? "FULL" : "OPEN"}</div>','<div class="${room.isPrivate ? "multiplayerOffline" : (full ? "multiplayerOffline" : "multiplayerOnline")}">${room.isPrivate ? "PRIVATE" : (full ? "FULL" : "OPEN")}</div>'],
            ['                roomInput.value = room.id;\n                localStorage.setItem("webminecraft-room", room.id);','                roomInput.value = room.id;\n                localStorage.setItem("webminecraft-room", room.id);\n                setServerType(Boolean(room.isPrivate));'],
            ['                setStatus(`Ready to join room "${room.id}".`);','                setStatus(room.isPrivate ? `Private room "${room.id}" selected. Enter the private code to join.` : `Ready to join room "${room.id}".`);'],
            ['        setServerType(selectedPrivate);\n        privateCodeInput.value = "";','        privateCodeInput.value = "";'],
            ['        if (defaultRoom) {\n            roomInput.value = defaultRoom.id;\n            joinButton.disabled = Number(defaultRoom.players) >= Number(defaultRoom.maxPlayers || server.maxPlayers || 10);','        if (defaultRoom) {\n            roomInput.value = defaultRoom.id;\n            setServerType(Boolean(defaultRoom.isPrivate));\n            joinButton.disabled = Number(defaultRoom.players) >= Number(defaultRoom.maxPlayers || server.maxPlayers || 10);'],
            ['Public servers appear in the server list. Private servers stay hidden and can only be joined with their private code.','Public and private servers both appear in the list. Private servers require their private code to join.']
          ];
          for (const [from,to] of clientReplacements) { if (!client.includes(from)) throw new Error(`client replacement not found: ${from}`); client = client.replace(from,to); }
          fs.writeFileSync(clientPath, client);
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js src/multiplayerClient.js
          git diff --cached --quiet && exit 0
          git commit -m "Show private servers and require join codes"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/patch-visible-private-servers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/patch-visible-private-servers.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary private server patch workflow"
          git push
