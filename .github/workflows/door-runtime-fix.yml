name: Fix door runtime

'on':
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/door-runtime-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Rework door collision') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Patch door state and collision
        shell: python
        run: |
          from pathlib import Path

          door_path = Path('src/door.js')
          door = door_path.read_text()
          door = door.replace('const doors = new Map();\nconst BLOCK = getBlockTypes();', 'const doors = new Map();\nconst openDoorStates = new Map();\nconst BLOCK = getBlockTypes();', 1)
          door = door.replace('group.userData.open = openAngle !== 0;\n    group.userData.openAngle = openAngle;', 'const preservedAngle = openAngle || openDoorStates.get(key(x, y, z)) || 0;\n    group.userData.open = preservedAngle !== 0;\n    group.userData.openAngle = preservedAngle;', 1)
          door = door.replace('    panel.rotation.y = openAngle;', '    panel.rotation.y = preservedAngle;', 1)

          old = '''function updateDoorCollisionState(door) {
    const { x, y, z } = door.userData.doorBase;
    const open = !!door.userData.open;
    if (open) {
        setBlockAt(x, y, z, BLOCK.AIR);
        setBlockAt(x, y + 1, z, BLOCK.AIR);
    } else {
        if (getBlockAt(x, y, z) !== BLOCK.AIR || getBlockAt(x, y + 1, z) !== BLOCK.AIR) return false;
        setBlockAt(x, y, z, DOOR_BLOCK);
        setBlockAt(x, y + 1, z, DOOR_BLOCK);
    }
    return true;
}

function toggleDoor(door) {
    if (!door) return false;
    if (door.userData.open) {
        if (!updateDoorCollisionState({ userData: { ...door.userData, open: false } })) return false;
        door.userData.open = false;
        door.userData.openAngle = 0;
    } else {
        const { x, z } = door.userData.doorBase;
        const side = door.userData.facing === "x" ? camera.position.x - x : camera.position.z - z;
        door.userData.open = true;
        door.userData.openAngle = side >= 0 ? Math.PI / 2 : -Math.PI / 2;
        updateDoorCollisionState(door);
    }
    const panel = door.children[0];
    if (panel) panel.rotation.y = door.userData.openAngle;
    return true;
}'''
          new = '''function updateDoorCollisionState(door) {
    if (!door) return false;
    const { x, y, z } = door.userData.doorBase;
    const k = key(x, y, z);
    if (door.userData.open) openDoorStates.set(k, door.userData.openAngle || Math.PI / 2);
    else openDoorStates.delete(k);
    return true;
}

function toggleDoor(door) {
    if (!door) return false;
    const { x, z } = door.userData.doorBase;
    if (door.userData.open) {
        door.userData.open = false;
        door.userData.openAngle = 0;
    } else {
        const side = door.userData.facing === "x" ? camera.position.x - x : camera.position.z - z;
        door.userData.open = true;
        door.userData.openAngle = side >= 0 ? Math.PI / 2 : -Math.PI / 2;
    }
    updateDoorCollisionState(door);
    const panel = door.children[0];
    if (panel) panel.rotation.y = door.userData.openAngle;
    return true;
}

export function isDoorBlocking(x, y, z) {
    return !openDoorStates.has(key(x, y, z));
}'''
          if old not in door: raise SystemExit('door collision function not found')
          door = door.replace(old, new, 1)

          door = door.replace('    if (action === "break") {\n        const { x, y, z } = target;\n        setBlockAt(x, y, z, BLOCK.AIR);', '    if (action === "break") {\n        const { x, y, z } = target;\n        openDoorStates.delete(key(x, y, z));\n        setBlockAt(x, y, z, BLOCK.AIR);', 1)
          door = door.replace('    const facing = Math.abs(normal.x) > Math.abs(normal.z) ? "x" : "z";\n    if (!setBlockAt(x, y, z, DOOR_BLOCK)) return false;', '    const facing = Math.abs(normal.x) > Math.abs(normal.z) ? "x" : "z";\n    openDoorStates.delete(key(x, y, z));\n    if (!setBlockAt(x, y, z, DOOR_BLOCK)) return false;', 1)
          door_path.write_text(door)

          player_path = Path('src/player.js')
          player = player_path.read_text()
          player = player.replace('import { getBlockAt } from "./world.js";\n', 'import { getBlockAt } from "./world.js";\nimport { isDoorBlocking } from "./door.js";\n', 1)
          player = player.replace('function blockExists(x, y, z) {\n    return !!getBlockAt(x, y, z);\n}', 'function blockExists(x, y, z) {\n    const type = getBlockAt(x, y, z);\n    if (!type) return false;\n    if (type === 17) return isDoorBlocking(x, y, z);\n    return true;\n}', 1)
          player_path.write_text(player)
          PY

      - name: Build
        run: npm install --ignore-scripts --no-audit --no-fund && node ./node_modules/vite/bin/vite.js build

      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/door-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/door.js src/player.js .github/workflows/door-runtime-fix.yml
          git commit -m "Rework door collision"
          git push origin main

# trigger door runtime repair
