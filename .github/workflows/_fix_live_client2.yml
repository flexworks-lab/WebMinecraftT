name: Fix live client sync 2
on:
  push:
    paths:
      - .github/workflows/_fix_live_client2.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch client
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/multiplayerClient.js')
          s = p.read_text()
          if 'applyPendingWorldChanges();' not in s.split('message =>', 1)[-1]:
              s, count = re.subn(r'(else if \(message\.type === ["\']block_change["\']\)\s*\{\s*queueWorldChange\(message\);)', r'\1\n                applyPendingWorldChanges();', s, count=1)
              if count != 1:
                  raise SystemExit('block_change handler not found')
          world_sync = '''            } else if (message.type === "world_sync") {
                if (Number.isFinite(Number(message.worldSeed))) {
                    const currentSeed = Number(message.worldSeed) >>> 0;
                    if (currentSeed !== 0) {
                        const seedInput = document.getElementById("seedInput");
                        if (seedInput && Number(seedInput.value) !== currentSeed) seedInput.value = String(currentSeed);
                    }
                }
                for (const change of message.worldChanges || []) queueWorldChange(change);
                applyPendingWorldChanges();
'''
          if 'message.type === "world_sync"' not in s:
              s, count = re.subn(r'(\s*} else if \(message\.type === "player_joined"\) \{)', '\n' + world_sync + r'\1', s, count=1)
              if count != 1:
                  raise SystemExit('player_joined insertion point not found')
          marker = 'export function syncWorldChanges() {'
          if 'worldSyncTimer' not in s:
              s = s.replace(marker, '''let worldSyncTimer = null;

function startWorldSyncTimer() {
    if (worldSyncTimer) return;
    worldSyncTimer = setInterval(() => {
        if (!isMultiplayerActive()) return;
        try { socket.send(JSON.stringify({ type: "world_sync_request" })); } catch {}
    }, 750);
}

export function syncWorldChanges() {''', 1)
              s = s.replace('        joinButton.textContent = "Connected";\n                startSharedWorld', '        joinButton.textContent = "Connected";\n                startWorldSyncTimer();\n                startSharedWorld', 1)
          p.write_text(s)
      - name: Commit and remove temp workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_fix_live_client.yml .github/workflows/_fix_live_client2.yml .github/workflows/_live_world_sync.yml
          git add src/multiplayerClient.js .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "FIX: Live world reconciliation"
          git push
