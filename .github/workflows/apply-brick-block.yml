name: Apply brick block support

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply brick block support'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply brick support patches
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function patch(path, replacements) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (text.includes(to)) continue;
              if (!text.includes(from)) throw new Error(`Expected text not found in ${path}: ${from}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text);
          }

          patch('src/inventory.js', [
            [
              '    { id: 17, name: "Oak Door", texture: "oak_door_bottom.png", category: "tools" }\n',
              '    { id: 17, name: "Oak Door", texture: "oak_door_bottom.png", category: "tools" },\n    { id: 18, name: "Bricks", texture: "bricks.svg", category: "building" }\n'
            ],
            [
              '    { id: "natural", label: "Natural Blocks", icon: "◆" },\n',
              '    { id: "natural", label: "Natural Blocks", icon: "◆" },\n    { id: "building", label: "Building Blocks", icon: "▦" },\n'
            ],
            [
              '    if (name === "natural") return \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.9 2.5 8 6.1 8 10.1A8 8 0 1 1 4 13.1C4 9.8 6.7 6 12 3Z"/><path d="M12 21c0-5 1.8-9 5.9-12"/></svg>\';\n',
              '    if (name === "natural") return \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.9 2.5 8 6.1 8 10.1A8 8 0 1 1 4 13.1C4 9.8 6.7 6 12 3Z"/><path d="M12 21c0-5 1.8-9 5.9-12"/></svg>\';\n    if (name === "building") return \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-5 8 5v12H4Z"/><path d="M8 20v-6h8v6M7 9h2M15 9h2M7 12h2M15 12h2"/></svg>\';\n'
            ],
            [
              '    section.textContent = selectedTab === "search" ? "Search Results" : (selectedTab === "tools" ? "Tools & Utilities" : "Natural Blocks");\n',
              '    section.textContent = selectedTab === "search" ? "Search Results" : (selectedTab === "tools" ? "Tools & Utilities" : selectedTab === "building" ? "Building Blocks" : "Natural Blocks");\n'
            ]
          ]);

          patch('src/interaction.js', [
            ['        if (itemId > BLOCK.TNT) return;\n', '        if (itemId > BLOCK.BRICKS) return;\n']
          ]);

          patch('src/heldBlock3D.js', [
            [
              '    snowMaterial,\n    tntMaterial\n',
              '    snowMaterial,\n    tntMaterial,\n    bricksMaterial\n'
            ],
            [
              '    14: snowMaterial,\n    15: tntMaterial\n',
              '    14: snowMaterial,\n    15: tntMaterial,\n    18: bricksMaterial\n'
            ]
          ]);

          patch('src/multiplayerHeldBlock.js', [
            [
              '    snowMaterial,\n    tntMaterial\n',
              '    snowMaterial,\n    tntMaterial,\n    bricksMaterial\n'
            ],
            [
              '    14: snowMaterial,\n    15: tntMaterial\n',
              '    14: snowMaterial,\n    15: tntMaterial,\n    18: bricksMaterial\n'
            ]
          ]);

          patch('src/worldSave.js', [
            [
              '        17: "oak_door_bottom.png"\n',
              '        17: "oak_door_bottom.png",\n        18: "bricks.svg"\n'
            ]
          ]);

          patch('src/survivalMiningSystem.js', [
            [
              '    8: 420, 9: 900, 10: Infinity, 11: 1200, 12: 1250, 13: 750, 14: 300, 15: 800\n',
              '    8: 420, 9: 900, 10: Infinity, 11: 1200, 12: 1250, 13: 750, 14: 300, 15: 800, 18: 900\n'
            ],
            [
              '    12: "iron_ore.png", 13: "oak_planks.png", 14: "snow.png", 15: "tnt_side.png"\n',
              '    12: "iron_ore.png", 13: "oak_planks.png", 14: "snow.png", 15: "tnt_side.png", 18: "bricks.svg"\n'
            ],
            [
              '    11: 0x343434, 12: 0x929292, 13: 0xb68752, 14: 0xf1f7ff, 15: 0xd73636\n',
              '    11: 0x343434, 12: 0x929292, 13: 0xb68752, 14: 0xf1f7ff, 15: 0xd73636, 18: 0xa44b3b\n'
            ]
          ]);

          patch('src/world.js', [
            ['item.x-playerChunkChunkX', 'item.x-playerChunkX'],
            ['item.z-playerChunkChunkZ', 'item.z-playerChunkZ']
          ]);

          if (!fs.existsSync('public/textures/bricks.svg')) throw new Error('bricks.svg is missing');
          NODE

      - name: Build check
        run: npm run build

      - name: Commit patched game
        shell: bash
        run: |
          rm -f .github/workflows/apply-brick-block.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply brick block support"
          git push origin HEAD:main
