name: Apply multiplayer world sync

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'AUTO: Apply multiplayer world sync') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # server/server.js
          p = Path('server/server.js')
          s = p.read_text()
          if 'blockChanges: new Map()' not in s:
              s = s.replace(
                  'return { id, players: new Map(), worldSeed: Math.floor(Math.random() * 4294967296) >>> 0, createdAt: Date.now() };',
                  'return { id, players: new Map(), worldSeed: Math.floor(Math.random() * 4294967296) >>> 0, blockChanges: new Map(), createdAt: Date.now() };', 1)
          if 'worldChanges: [...room.blockChanges.values()]' not in s:
              s = s.replace(
                  '            worldSeed: room.worldSeed,\n            maxPlayers: MAX_PLAYERS_PER_SERVER,',
                  '            worldSeed: room.worldSeed,\n            maxPlayers: MAX_PLAYERS_PER_SERVER,\n            worldChanges: [...room.blockChanges.values()],', 1)
          if 'message.type === "block_change"' not in s:
              marker = '    if (message.type === "player_state") {'
              handler = '''    if (message.type === "block_change") {\n        const x = Math.floor(numberOr(message.x, NaN));\n        const y = Math.floor(numberOr(message.y, NaN));\n        const z = Math.floor(numberOr(message.z, NaN));\n        const type = Math.floor(numberOr(message.blockType, NaN));\n        if (![x, y, z, type].every(Number.isFinite) || y < -32 || y > 95 || type < 0 || type > 15) return;\n        const room = rooms.get(player.room);\n        if (!room) return;\n        const key = `${x},${y},${z}`;\n        room.blockChanges.set(key, { x, y, z, type });\n        if (room.blockChanges.size > 50000) {\n            const oldest = room.blockChanges.keys().next().value;\n            if (oldest) room.blockChanges.delete(oldest);\n        }\n        broadcast(room, { type: "block_change", x, y, z, type }, player.id);\n        return;\n    }\n\n'''
              s = s.replace(marker, handler + marker, 1)
          p.write_text(s)

          # src/multiplayerClient.js
          p = Path('src/multiplayerClient.js')
          s = p.read_text()
          if 'import { setBlockAt } from "./world.js";' not in s:
              s = 'import { setBlockAt } from "./world.js";\n\n' + s
          if 'const pendingWorldChanges = new Map();' not in s:
              s = s.replace('let remotePlayers = new Map();\n', 'let remotePlayers = new Map();\nconst pendingWorldChanges = new Map();\n', 1)
          if 'function queueWorldChange(' not in s:
              helper = '''\nfunction queueWorldChange(change) {\n    const x = Math.floor(Number(change?.x));\n    const y = Math.floor(Number(change?.y));\n    const z = Math.floor(Number(change?.z));\n    const type = Math.floor(Number(change?.type));\n    if (![x, y, z, type].every(Number.isFinite)) return;\n    pendingWorldChanges.set(`${x},${y},${z}`, { x, y, z, type });\n}\n\nfunction applyPendingWorldChanges() {\n    for (const [key, change] of pendingWorldChanges) {\n        if (setBlockAt(change.x, change.y, change.z, change.type)) pendingWorldChanges.delete(key);\n    }\n}\n'''
              s = s.replace('function makeStyle() {', helper + '\nfunction makeStyle() {', 1)
          s = s.replace('    openWorldButton.click();\n}', '    openWorldButton.click();\n    requestAnimationFrame(applyPendingWorldChanges);\n}', 1)
          if 'for (const change of message.worldChanges || []) queueWorldChange(change);' not in s:
              s = s.replace(
                  '                remotePlayers = new Map((message.players || []).filter(player => player.id !== localPlayerId).map(player => [player.id, player]));\n',
                  '                remotePlayers = new Map((message.players || []).filter(player => player.id !== localPlayerId).map(player => [player.id, player]));\n                pendingWorldChanges.clear();\n                for (const change of message.worldChanges || []) queueWorldChange(change);\n', 1)
          if 'message.type === "block_change"' not in s:
              s = s.replace('            } else if (message.type === "player_joined") {', '            } else if (message.type === "block_change") {\n                queueWorldChange(message);\n            } else if (message.type === "player_joined") {', 1)
          if 'export function sendBlockChange(' not in s:
              s = s.replace(
                  'export function getRemotePlayers() { return remotePlayers; }',
                  'export function sendBlockChange(x, y, z, blockType) {\n    if (!isMultiplayerActive()) return;\n    socket.send(JSON.stringify({ type: "block_change", x: Math.floor(x), y: Math.floor(y), z: Math.floor(z), blockType: Math.floor(blockType) }));\n}\n\nexport function syncWorldChanges() {\n    if (isMultiplayerActive()) applyPendingWorldChanges();\n}\n\nexport function getRemotePlayers() { return remotePlayers; }', 1)
          s = s.replace('        localPlayerId = null;\n        window.__webminecraftMultiplayerActive', '        localPlayerId = null;\n        pendingWorldChanges.clear();\n        window.__webminecraftMultiplayerActive', 1)
          p.write_text(s)

          # src/interaction.js
          p = Path('src/interaction.js')
          s = p.read_text()
          if 'import { sendBlockChange } from "./multiplayerClient.js";' not in s:
              s = s.replace('import { touchInput } from "./controls.js";\n', 'import { touchInput } from "./controls.js";\nimport { sendBlockChange } from "./multiplayerClient.js";\n', 1)
          s = s.replace('        if (getBlockAt(x, y, z)) setBlockAt(x, y, z, BLOCK.AIR);', '        if (getBlockAt(x, y, z) && setBlockAt(x, y, z, BLOCK.AIR)) sendBlockChange(x, y, z, BLOCK.AIR);', 1)
          s = s.replace('    setBlockAt(x, y, z, materials[selectedSlot]);', '    if (setBlockAt(x, y, z, materials[selectedSlot])) sendBlockChange(x, y, z, materials[selectedSlot]);', 1)
          p.write_text(s)

          # src/player.js -- world sync plus nameplates
          p = Path('src/player.js')
          s = p.read_text()
          s = s.replace('import { getRemotePlayers, isMultiplayerActive, sendPlayerState } from "./multiplayerClient.js";', 'import { getRemotePlayers, isMultiplayerActive, sendPlayerState, syncWorldChanges } from "./multiplayerClient.js";', 1)
          if 'function createNameplate(' not in s:
              helper = '''function createNameplate(name) {\n    const canvas = document.createElement("canvas");\n    canvas.width = 384;\n    canvas.height = 72;\n    const ctx = canvas.getContext("2d");\n    const text = String(name || "Player").slice(0, 16);\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    ctx.font = "bold 32px Arial";\n    ctx.textAlign = "center";\n    ctx.textBaseline = "middle";\n    ctx.lineWidth = 9;\n    ctx.strokeStyle = "rgba(0,0,0,.9)";\n    ctx.fillStyle = "white";\n    ctx.strokeText(text, canvas.width / 2, canvas.height / 2);\n    ctx.fillText(text, canvas.width / 2, canvas.height / 2);\n    const texture = new THREE.CanvasTexture(canvas);\n    texture.colorSpace = THREE.SRGBColorSpace;\n    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));\n    sprite.scale.set(Math.max(1.1, Math.min(2.8, 0.8 + text.length * 0.13)), 0.36, 1);\n    sprite.position.y = 2;\n    return sprite;\n}\n\n'''
              s = s.replace('function updateMultiplayerAvatars(scene) {', helper + 'function updateMultiplayerAvatars(scene) {', 1)
          if 'avatar.add(createNameplate(player.name));' not in s:
              old = '''        let dot = avatarDots.get(id);\n        if (!dot) {\n            dot = new THREE.Mesh(\n                new THREE.SphereGeometry(0.18, 8, 6),\n                new THREE.MeshBasicMaterial({ color: avatarColor(id) }),\n            );\n            dot.userData.multiplayerAvatar = true;\n            scene.add(dot);\n            avatarDots.set(id, dot);\n        }\n        dot.position.set(\n            Number(player.position.x) || 0,\n            (Number(player.position.y) || 0) - PLAYER_HEIGHT + 0.18,\n            Number(player.position.z) || 0,\n        );'''
              new = '''        let avatar = avatarDots.get(id);\n        if (!avatar) {\n            avatar = new THREE.Group();\n            const dot = new THREE.Mesh(\n                new THREE.SphereGeometry(0.18, 8, 6),\n                new THREE.MeshBasicMaterial({ color: avatarColor(id) }),\n            );\n            dot.userData.multiplayerAvatar = true;\n            avatar.add(dot);\n            avatar.add(createNameplate(player.name));\n            scene.add(avatar);\n            avatarDots.set(id, avatar);\n        }\n        avatar.position.set(\n            Number(player.position.x) || 0,\n            (Number(player.position.y) || 0) - PLAYER_HEIGHT + 0.18,\n            Number(player.position.z) || 0,\n        );'''
              s = s.replace(old, new, 1)
          old_cleanup = '''        if (!players.has(id)) {\n            scene.remove(dot);\n            dot.geometry.dispose();\n            dot.material.dispose();\n            avatarDots.delete(id);\n        }'''
          new_cleanup = '''        if (!players.has(id)) {\n            scene.remove(avatar);\n            avatar.traverse(child => {\n                if (child.geometry) child.geometry.dispose();\n                if (child.material) {\n                    if (child.material.map) child.material.map.dispose();\n                    child.material.dispose();\n                }\n            });\n            avatarDots.delete(id);\n        }'''
          if old_cleanup in s: s = s.replace(old_cleanup, new_cleanup, 1)
          if '    syncWorldChanges();\n}' not in s: s = s.replace('    updateMultiplayerAvatars(scene);\n}', '    updateMultiplayerAvatars(scene);\n    syncWorldChanges();\n}', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js src/multiplayerClient.js src/interaction.js src/player.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "AUTO: Apply multiplayer world sync"
          git push
