name: Patch multiplayer UI

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'AUTO: Patch multiplayer UI') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          client = Path('src/multiplayerClient.js').read_text()
          old = '''    const loadServers = async () => {\n        serverList.innerHTML = '<div class="multiplayerEmpty">Loading servers...</div>';'''
          new = '''    const loadServers = async () => {\n        renderServers([{\n            id: "webminecraft-official",\n            name: "WebMinecraft Official",\n            online: true,\n            players: 0,\n            maxPlayers: 10,\n            rooms: [],\n            websocket: PRODUCTION_SERVER_URL,\n        }]);\n        serverList.querySelector('.multiplayerCard')?.setAttribute('data-default-server', 'true');'''
          if old not in client:
              raise SystemExit('client loadServers anchor not found')
          client = client.replace(old, new, 1)
          Path('src/multiplayerClient.js').write_text(client)

          player = Path('src/player.js').read_text()
          if 'function createMultiplayerNameplate' not in player:
              marker = 'function updateMultiplayerAvatars(scene) {'
              helper = '''function createMultiplayerNameplate(name) {\n    const canvas = document.createElement("canvas");\n    canvas.width = 384;\n    canvas.height = 80;\n    const context = canvas.getContext("2d");\n    context.clearRect(0, 0, canvas.width, canvas.height);\n    context.font = "bold 34px Arial";\n    context.textAlign = "center";\n    context.textBaseline = "middle";\n    context.lineWidth = 10;\n    context.strokeStyle = "rgba(0,0,0,0.9)";\n    context.fillStyle = "#ffffff";\n    const text = String(name || "Player").slice(0, 16);\n    context.strokeText(text, canvas.width / 2, canvas.height / 2);\n    context.fillText(text, canvas.width / 2, canvas.height / 2);\n\n    const texture = new THREE.CanvasTexture(canvas);\n    texture.colorSpace = THREE.SRGBColorSpace;\n    texture.needsUpdate = true;\n    const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });\n    const sprite = new THREE.Sprite(material);\n    const width = Math.max(1.15, Math.min(2.7, text.length * 0.13 + 0.9));\n    sprite.scale.set(width, 0.38, 1);\n    sprite.position.set(0, 2.05, 0);\n    return sprite;\n}\n\n'''
              if marker not in player:
                  raise SystemExit('player avatar marker not found')
              player = player.replace(marker, helper + marker, 1)

          old_block = '''        let dot = avatarDots.get(id);\n        if (!dot) {\n            dot = new THREE.Mesh(\n                new THREE.SphereGeometry(0.18, 8, 6),\n                new THREE.MeshBasicMaterial({ color: avatarColor(id) }),\n            );\n            dot.userData.multiplayerAvatar = true;\n            scene.add(dot);\n            avatarDots.set(id, dot);\n        }\n        dot.position.set(\n            Number(player.position.x) || 0,\n            (Number(player.position.y) || 0) - PLAYER_HEIGHT + 0.18,\n            Number(player.position.z) || 0,\n        );'''
          new_block = '''        let avatar = avatarDots.get(id);\n        if (!avatar) {\n            avatar = new THREE.Group();\n            const dot = new THREE.Mesh(\n                new THREE.SphereGeometry(0.18, 8, 6),\n                new THREE.MeshBasicMaterial({ color: avatarColor(id) }),\n            );\n            dot.userData.multiplayerAvatar = true;\n            const nameplate = createMultiplayerNameplate(player.name);\n            avatar.add(dot);\n            avatar.add(nameplate);\n            scene.add(avatar);\n            avatarDots.set(id, avatar);\n        }\n        avatar.position.set(\n            Number(player.position.x) || 0,\n            (Number(player.position.y) || 0) - PLAYER_HEIGHT + 0.18,\n            Number(player.position.z) || 0,\n        );'''
          if old_block not in player:
              raise SystemExit('player avatar block not found')
          player = player.replace(old_block, new_block, 1)

          old_cleanup = '''        if (!players.has(id)) {\n            scene.remove(dot);\n            dot.geometry.dispose();\n            dot.material.dispose();\n            avatarDots.delete(id);\n        }'''
          new_cleanup = '''        if (!players.has(id)) {\n            scene.remove(avatar);\n            avatar.traverse(child => {\n                if (child.geometry) child.geometry.dispose();\n                if (child.material) {\n                    if (child.material.map) child.material.map.dispose();\n                    child.material.dispose();\n                }\n            });\n            avatarDots.delete(id);\n        }'''
          if old_cleanup not in player:
              raise SystemExit('player cleanup block not found')
          player = player.replace(old_cleanup, new_cleanup, 1)

          Path('src/player.js').write_text(player)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayerClient.js src/player.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "AUTO: Patch multiplayer UI"
          git push
