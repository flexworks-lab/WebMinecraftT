name: Apply missing texture blocks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Finish missing texture blocks'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patches
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function patch(path, replacements) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (text.includes(to)) continue;
              if (!text.includes(from)) throw new Error(`Expected text not found in ${path}: ${from}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text);
          }

          patch('src/blocks.js', [
            [
              'const bricksTexture = loadTexture(texturePath("bricks.svg"), "bricks");\n',
              'const bricksTexture = loadTexture(texturePath("bricks.png"), "bricks");\nconst stoneBricksTexture = loadTexture(texturePath("stone_bricks.png"), "stone bricks");\nconst crackedStoneBricksTexture = loadTexture(texturePath("cracked_stone_bricks.png"), "cracked stone bricks");\nconst mossyStoneBricksTexture = loadTexture(texturePath("mossy_stone_bricks.png"), "mossy stone bricks");\nconst dirtPathSideTexture = loadTexture(texturePath("dirt_path_side.png"), "dirt path side");\nconst dirtPathTopTexture = loadTexture(texturePath("dirt_path_top.png"), "dirt path top");\n'
            ],
            [
              'const bricksMaterial = new THREE.MeshPhongMaterial({ map: bricksTexture, color: textureShade, ...materialOptions });\n',
              'const bricksMaterial = new THREE.MeshPhongMaterial({ map: bricksTexture, color: textureShade, ...materialOptions });\nconst stoneBricksMaterial = new THREE.MeshPhongMaterial({ map: stoneBricksTexture, color: textureShade, ...materialOptions });\nconst crackedStoneBricksMaterial = new THREE.MeshPhongMaterial({ map: crackedStoneBricksTexture, color: textureShade, ...materialOptions });\nconst mossyStoneBricksMaterial = new THREE.MeshPhongMaterial({ map: mossyStoneBricksTexture, color: textureShade, ...materialOptions });\nconst dirtPathSideMaterial = new THREE.MeshPhongMaterial({ map: dirtPathSideTexture, color: textureShade, ...materialOptions });\nconst dirtPathTopMaterial = new THREE.MeshPhongMaterial({ map: dirtPathTopTexture, color: textureShade, ...materialOptions });\n'
            ],
            [
              'const tntMaterial = [tntSideMaterial, tntSideMaterial, tntTopMaterial, tntBottomMaterial, tntSideMaterial, tntSideMaterial];\n',
              'const tntMaterial = [tntSideMaterial, tntSideMaterial, tntTopMaterial, tntBottomMaterial, tntSideMaterial, tntSideMaterial];\nconst dirtPathMaterial = [dirtPathSideMaterial, dirtPathSideMaterial, dirtPathTopMaterial, dirtPathSideMaterial, dirtPathSideMaterial, dirtPathSideMaterial];\n'
            ],
            [
              '    bricksMaterial, bricksTexture, waterMaterial, waterTexture, createBlock\n',
              '    bricksMaterial, bricksTexture, stoneBricksMaterial, crackedStoneBricksMaterial, mossyStoneBricksMaterial, dirtPathMaterial,\n    stoneBricksTexture, crackedStoneBricksTexture, mossyStoneBricksTexture, dirtPathSideTexture, dirtPathTopTexture, waterMaterial, waterTexture, createBlock\n'
            ]
          ]);

          patch('src/world.js', [
            [
              '    leavesMaterial, snowMaterial, tntSideMaterial, tntTopMaterial, tntBottomMaterial,\n    bricksMaterial\n',
              '    leavesMaterial, snowMaterial, tntSideMaterial, tntTopMaterial, tntBottomMaterial,\n    bricksMaterial, stoneBricksMaterial, crackedStoneBricksMaterial, mossyStoneBricksMaterial, dirtPathMaterial\n'
            ],
            [
              '    OAK_PLANKS: 13, SNOW: 14, TNT: 15, BRICKS: 18\n',
              '    OAK_PLANKS: 13, SNOW: 14, TNT: 15, BRICKS: 18, STONE_BRICKS: 19, CRACKED_STONE_BRICKS: 20, MOSSY_STONE_BRICKS: 21, DIRT_PATH: 22\n'
            ],
            [
              '    tntSideMaterial, tntTopMaterial, tntBottomMaterial, bricksMaterial\n',
              '    tntSideMaterial, tntTopMaterial, tntBottomMaterial, bricksMaterial,\n    stoneBricksMaterial, crackedStoneBricksMaterial, mossyStoneBricksMaterial, dirtPathMaterial\n'
            ],
            [
              'function materialIndexFor(type,faceIndex){switch(type){case BLOCK.GRASS:return faceIndex===2?1:faceIndex===3?2:0;case BLOCK.DIRT:return 2;case BLOCK.STONE:return 3;case BLOCK.SAND:return 4;case BLOCK.OAK:return faceIndex===2||faceIndex===3?6:5;case BLOCK.LEAVES:return 7;case BLOCK.COBBLESTONE:return 8;case BLOCK.GRAVEL:return 9;case BLOCK.SANDSTONE:return 10;case BLOCK.BEDROCK:return 11;case BLOCK.COAL_ORE:return 12;case BLOCK.IRON_ORE:return 13;case BLOCK.OAK_PLANKS:return 14;case BLOCK.SNOW:return 15;case BLOCK.TNT:return faceIndex===2?17:faceIndex===3?18:16;case BLOCK.BRICKS:return 19;default:return 0;}}',
              'function materialIndexFor(type,faceIndex){switch(type){case BLOCK.GRASS:return faceIndex===2?1:faceIndex===3?2:0;case BLOCK.DIRT:return 2;case BLOCK.STONE:return 3;case BLOCK.SAND:return 4;case BLOCK.OAK:return faceIndex===2||faceIndex===3?6:5;case BLOCK.LEAVES:return 7;case BLOCK.COBBLESTONE:return 8;case BLOCK.GRAVEL:return 9;case BLOCK.SANDSTONE:return 10;case BLOCK.BEDROCK:return 11;case BLOCK.COAL_ORE:return 12;case BLOCK.IRON_ORE:return 13;case BLOCK.OAK_PLANKS:return 14;case BLOCK.SNOW:return 15;case BLOCK.TNT:return faceIndex===2?17:faceIndex===3?18:16;case BLOCK.BRICKS:return 19;case BLOCK.STONE_BRICKS:return 20;case BLOCK.CRACKED_STONE_BRICKS:return 21;case BLOCK.MOSSY_STONE_BRICKS:return 22;case BLOCK.DIRT_PATH:return faceIndex===2?23:23;default:return 0;}}'
            ]
          ]);

          patch('src/inventory.js', [
            [
              '    { id: 17, name: "Oak Door", texture: "oak_door_bottom.png", category: "tools" },\n    { id: 18, name: "Bricks", texture: "bricks.svg", category: "building" }\n',
              '    { id: 17, name: "Oak Door", texture: "oak_door_bottom.png", category: "tools" },\n    { id: 18, name: "Bricks", texture: "bricks.png", category: "natural" },\n    { id: 19, name: "Stone Bricks", texture: "stone_bricks.png", category: "natural" },\n    { id: 20, name: "Cracked Stone Bricks", texture: "cracked_stone_bricks.png", category: "natural" },\n    { id: 21, name: "Mossy Stone Bricks", texture: "mossy_stone_bricks.png", category: "natural" },\n    { id: 22, name: "Dirt Path", texture: "dirt_path_top.png", category: "natural" }\n'
            ],
            [
              '    { id: "tools", label: "Tools & Utilities", icon: "⚒" },\n    { id: "natural", label: "Natural Blocks", icon: "◆" },\n    { id: "building", label: "Building Blocks", icon: "▦" },\n    { id: "search", label: "Search", icon: "⌕" },\n',
              '    { id: "tools", label: "Tools & Utilities", icon: "⚒" },\n    { id: "natural", label: "Natural Blocks", icon: "◆" },\n    { id: "search", label: "Search", icon: "⌕" },\n'
            ],
            [
              '    if (name === "natural") return \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.9 2.5 8 6.1 8 10.1A8 8 0 1 1 4 13.1C4 9.8 6.7 6 12 3Z"/><path d="M12 21c0-5 1.8-9 5.9-12"/></svg>\';\n    if (name === "building") return \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-5 8 5v12H4Z"/><path d="M8 20v-6h8v6M7 9h2M15 9h2M7 12h2M15 12h2"/></svg>\';\n',
              '    if (name === "natural") return \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.9 2.5 8 6.1 8 10.1A8 8 0 1 1 4 13.1C4 9.8 6.7 6 12 3Z"/><path d="M12 21c0-5 1.8-9 5.9-12"/></svg>\';\n'
            ],
            [
              '    section.textContent = selectedTab === "search" ? "Search Results" : (selectedTab === "tools" ? "Tools & Utilities" : selectedTab === "building" ? "Building Blocks" : "Natural Blocks");\n',
              '    section.textContent = selectedTab === "search" ? "Search Results" : (selectedTab === "tools" ? "Tools & Utilities" : "Natural Blocks");\n'
            ]
          ]);

          patch('src/interaction.js', [
            ['        if (itemId > BLOCK.BRICKS) return;\n', '        if (itemId > BLOCK.DIRT_PATH) return;\n']
          ]);

          patch('src/heldBlock3D.js', [
            [
              '    tntMaterial,\n    bricksMaterial\n',
              '    tntMaterial,\n    bricksMaterial,\n    stoneBricksMaterial,\n    crackedStoneBricksMaterial,\n    mossyStoneBricksMaterial,\n    dirtPathMaterial\n'
            ],
            [
              '    15: tntMaterial,\n    18: bricksMaterial\n',
              '    15: tntMaterial,\n    18: bricksMaterial,\n    19: stoneBricksMaterial,\n    20: crackedStoneBricksMaterial,\n    21: mossyStoneBricksMaterial,\n    22: dirtPathMaterial\n'
            ]
          ]);

          patch('src/multiplayerHeldBlock.js', [
            [
              '    tntMaterial,\n    bricksMaterial\n',
              '    tntMaterial,\n    bricksMaterial,\n    stoneBricksMaterial,\n    crackedStoneBricksMaterial,\n    mossyStoneBricksMaterial,\n    dirtPathMaterial\n'
            ],
            [
              '    15: tntMaterial,\n    18: bricksMaterial\n',
              '    15: tntMaterial,\n    18: bricksMaterial,\n    19: stoneBricksMaterial,\n    20: crackedStoneBricksMaterial,\n    21: mossyStoneBricksMaterial,\n    22: dirtPathMaterial\n'
            ]
          ]);

          patch('src/worldSave.js', [
            [
              '        18: "bricks.svg"\n',
              '        18: "bricks.png",\n        19: "stone_bricks.png",\n        20: "cracked_stone_bricks.png",\n        21: "mossy_stone_bricks.png",\n        22: "dirt_path_top.png"\n'
            ]
          ]);

          patch('src/survivalMiningSystem.js', [
            [
              '    8: 420, 9: 900, 10: Infinity, 11: 1200, 12: 1250, 13: 750, 14: 300, 15: 800, 18: 900\n',
              '    8: 420, 9: 900, 10: Infinity, 11: 1200, 12: 1250, 13: 750, 14: 300, 15: 800, 18: 900, 19: 1100, 20: 1100, 21: 1100, 22: 500\n'
            ],
            [
              '    12: "iron_ore.png", 13: "oak_planks.png", 14: "snow.png", 15: "tnt_side.png", 18: "bricks.svg"\n',
              '    12: "iron_ore.png", 13: "oak_planks.png", 14: "snow.png", 15: "tnt_side.png", 18: "bricks.png", 19: "stone_bricks.png", 20: "cracked_stone_bricks.png", 21: "mossy_stone_bricks.png", 22: "dirt_path_top.png"\n'
            ],
            [
              '    11: 0x343434, 12: 0x929292, 13: 0xb68752, 14: 0xf1f7ff, 15: 0xd73636, 18: 0xa44b3b\n',
              '    11: 0x343434, 12: 0x929292, 13: 0xb68752, 14: 0xf1f7ff, 15: 0xd73636, 18: 0xa44b3b, 19: 0x7f7f7f, 20: 0x707070, 21: 0x5f7b50, 22: 0x8f7a55\n'
            ]
          ]);

          patch('src/menuUpdates.js', [
            [
              '        #newsButton{position:fixed !important;left:28px !important;bottom:28px !important;width:118px !important;margin:0 !important;z-index:97 !important}\n',
              '        #newsButton{position:fixed !important;left:28px !important;bottom:28px !important;width:118px !important;margin:0 !important;z-index:1000 !important;display:block !important;pointer-events:auto !important}\n'
            ],
            [
              'function createNewsUi(){\n    if(!updates||!menu||document.getElementById("newsButton"))return;\n',
              'function createNewsUi(){\n    if(document.getElementById("newsButton"))return;\n'
            ]
          ]);

          // Keep the new block types completely out of world generation. They only
          // exist when placed through Creative/inventory or loaded from saved data.
          NODE

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-texture-blocks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish missing texture blocks"
          git push origin HEAD:main
