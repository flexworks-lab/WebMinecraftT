name: Railway Multiplayer Deployment

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/railway-deployment.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  railway-multiplayer:
    runs-on: ubuntu-latest
    environment:
      name: railway-multiplayer
      url: https://webminecraftt-multiplayer-production.up.railway.app
    steps:
      - name: Check Railway multiplayer server
        run: |
          set -e
          curl --fail --silent --show-error --retry 3             https://webminecraftt-multiplayer-production.up.railway.app/health
          echo
          echo "Railway multiplayer server is online."

      - name: Remove old Render deployments
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_RENDER_HOST: webminecraft-server.onrender.com
        run: |
          set -euo pipefail

          gh api --paginate             "repos/${GITHUB_REPOSITORY}/deployments?per_page=100" |
            jq -c '.[]' > /tmp/deployments.jsonl

          while IFS= read -r deployment; do
            [ -n "$deployment" ] || continue

            id=$(jq -r '.id' <<<"$deployment")
            environment=$(jq -r '.environment // ""' <<<"$deployment" | tr '[:upper:]' '[:lower:]')
            description=$(jq -r '.description // ""' <<<"$deployment" | tr '[:upper:]' '[:lower:]')
            payload=$(jq -c '.payload // {}' <<<"$deployment" | tr '[:upper:]' '[:lower:]')
            creator=$(jq -r '.creator.login // ""' <<<"$deployment" | tr '[:upper:]' '[:lower:]')

            is_old=false
            if [[ "$environment" == *render* ||
                  "$description" == *render* ||
                  "$payload" == *"$OLD_RENDER_HOST"* ||
                  "$payload" == *"render.com"* ||
                  "$creator" == "render" ]]; then
              is_old=true
            else
              if gh api --paginate                 "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=100" |
                jq -e --arg host "$OLD_RENDER_HOST" '
                  any(.[]; ((.target_url // "") | contains($host)) or ((.environment_url // "") | contains($host)))
                ' >/dev/null; then
                is_old=true
              fi
            fi

            if [ "$is_old" = true ]; then
              echo "Removing old Render deployment $id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/${id}"
            fi
          done < /tmp/deployments.jsonl
