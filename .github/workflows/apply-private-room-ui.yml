name: Apply private room UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch multiplayer client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/multiplayerClient.js')
          text = path.read_text()

          old = '''const renderRoomList = server => { roomList.innerHTML = ""; const rooms = [...(server.rooms || [])].sort((a, b) => String(a.id).localeCompare(String(b.id))); if (!rooms.length) { roomList.innerHTML = '<div class="multiplayerEmpty">No rooms are listed yet. Create one below.</div>'; return; } for (const room of rooms) { const button = document.createElement("button"); button.type = "button"; button.className = "multiplayerCard"; const count = Number(room.players) || 0, max = Number(room.maxPlayers) || 0; button.innerHTML = `<div class="multiplayerCardTop"><span class="multiplayerCardName">${escapeHtml(room.name || room.id || "Room")}</span><span class="multiplayerOnline">${count}${max ? `/${max}` : ""} online</span></div><div class="multiplayerMeta">${escapeHtml(room.id || "default")} • Joinable room</div>`; button.addEventListener("click", () => { roomInput.value = String(room.id || room.name || "default").slice(0, 32); setStatus(`Selected room "${room.name || room.id || "default"}".`); joinButton.disabled = false; }); roomList.appendChild(button); } };'''

          new = '''const renderRoomList = server => { roomList.innerHTML = ""; const rooms = [...(server.rooms || [])].sort((a, b) => String(a.id).localeCompare(String(b.id))); if (!rooms.length) { roomList.innerHTML = '<div class="multiplayerEmpty">No rooms are listed yet. Create one below.</div>'; return; } for (const room of rooms) { const button = document.createElement("button"); button.type = "button"; button.className = "multiplayerCard"; const count = Number(room.players) || 0, max = Number(room.maxPlayers) || 0; const roomIsPrivate = Boolean(room.private || room.isPrivate); button.innerHTML = `<div class="multiplayerCardTop"><span class="multiplayerCardName">${escapeHtml(room.name || room.id || "Room")}</span><span class="${roomIsPrivate ? "multiplayerOffline" : "multiplayerOnline"}">${roomIsPrivate ? "🔒 PRIVATE" : `${count}${max ? `/${max}` : ""} online`}</span></div><div class="multiplayerMeta">${escapeHtml(room.id || "default")} • ${roomIsPrivate ? "Private room • code required" : "Joinable room"}</div>`; button.addEventListener("click", () => { roomInput.value = String(room.id || room.name || "default").slice(0, 32); setServerType(roomIsPrivate); joinButton.disabled = false; if (roomIsPrivate) { privateCodeInput.value = ""; setStatus(`🔒 Private room selected. Enter its private code to join.`); requestAnimationFrame(() => { privateCodeInput.focus(); }); } else { setStatus(`Selected room "${room.name || room.id || "default"}".`); } }); roomList.appendChild(button); } };'''

          if old not in text:
              raise SystemExit('Expected room-list code was not found; refusing to make a blind edit.')
          text = text.replace(old, new, 1)

          old_error = '''else if (message.type === "error") { setStatus(message.message || "Server error.", true); joinButton.disabled = false; joinButton.textContent = "Join Room"; }'''
          new_error = '''else if (message.type === "error") { setStatus(message.message || "Server error.", true); joinButton.disabled = false; joinButton.textContent = "Join Room"; if (message.code === "private_code_required") { setServerType(true); privateCodeInput.value = ""; requestAnimationFrame(() => privateCodeInput.focus()); } }'''
          if old_error not in text:
              raise SystemExit('Expected error handler was not found; refusing to make a blind edit.')
          text = text.replace(old_error, new_error, 1)

          path.write_text(text)
          PY

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayerClient.js .github/workflows/apply-private-room-ui.yml
          git rm .github/workflows/apply-private-room-ui.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Make private rooms require a code"
          git push