name: Move Private Server Choice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move private server controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/multiplayerClient.js')
          s = p.read_text()

          old_server = '''                <button id="multiplayerRefresh" class="multiplayerButton" type="button">Refresh Servers</button>\n                <div id="multiplayerServerList"><div class="multiplayerEmpty">Loading servers...</div></div>'''
          new_server = '''                <button id="multiplayerRefresh" class="multiplayerButton" type="button">Refresh Servers</button>\n                <div id="multiplayerServerList"><div class="multiplayerEmpty">Loading servers...</div></div>\n                <div id="multiplayerServerType" role="group" aria-label="Server type">\n                    <button id="multiplayerPublic" class="multiplayerTypeButton selected" type="button">PUBLIC</button>\n                    <button id="multiplayerPrivate" class="multiplayerTypeButton" type="button">PRIVATE</button>\n                </div>\n                <div class="multiplayerHint">Choose PUBLIC to appear in the server list, or PRIVATE to keep your server hidden.</div>'''
          if old_server not in s:
              raise SystemExit('Server view anchor not found')
          s = s.replace(old_server, new_server, 1)

          old_room = '''                <div id="multiplayerServerType" role="group" aria-label="Server type">\n                    <button id="multiplayerPublic" class="multiplayerTypeButton selected" type="button">PUBLIC</button>\n                    <button id="multiplayerPrivate" class="multiplayerTypeButton" type="button">PRIVATE</button>\n                </div>\n'''
          if old_room not in s:
              raise SystemExit('Room server type block not found')
          s = s.replace(old_room, '', 1)

          old_select = '        setServerType(false);\n        privateCodeInput.value = "";'
          new_select = '        setServerType(selectedPrivate);\n        privateCodeInput.value = "";'
          if old_select not in s:
              raise SystemExit('Server selection reset not found')
          s = s.replace(old_select, new_select, 1)

          p.write_text(s)
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplayerClient.js
          git diff --cached --quiet && exit 0
          git commit -m "Move private server choice to multiplayer screen"
          git push

      - name: Remove patch workflow
        if: always()
        run: |
          git rm .github/workflows/move-private-ui.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-shot UI patch workflow"
          git push
