name: Finish TNT gameplay

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finish:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source changes
        run: python3 .github/tnt_finish.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world.js src/inventory.js src/interaction.js .github/tnt_finish.py
          git commit -m "Add TNT block and Flint and Steel gameplay"
          git push
      - name: Remove one-time helper
        run: |
          git rm .github/tnt_finish.py .github/workflows/tnt-finish.yml
          git commit -m "Remove one-time TNT integration helper"
          git push
