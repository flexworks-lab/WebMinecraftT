name: Live world sync patch
on:
  push:
    paths:
      - .github/workflows/_live_world_sync.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch live sync
        shell: python
        run: |
          from pathlib import Path
          world = Path('src/world.js')
          s = world.read_text()
          s = s.replace('const queuedKeys = new Set();\nlet worldScene = null;', 'const queuedKeys = new Set();\nconst worldOverrides = new Map();\nlet worldScene = null;', 1)
          marker = 'function generateChunk(chunkX, chunkZ) {'
          helper = '''function applyWorldOverridesToChunk(chunk) {
              for (const [key, type] of worldOverrides) {
                  const [x, y, z] = key.split(',').map(Number);
                  if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
                  if (Math.floor(x / CHUNK_SIZE) !== chunk.x || Math.floor(z / CHUNK_SIZE) !== chunk.z) continue;
                  if (y < MIN_Y || y > WORLD_TOP) continue;
                  const localX = ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
                  const localZ = ((z % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
                  chunk.blocks[blockIndex(localX, y, localZ)] = type;
              }
          }

          function generateChunk(chunkX, chunkZ) {'''
          if marker in s and 'function applyWorldOverridesToChunk(chunk)' not in s:
              s = s.replace(marker, helper, 1)
          s = s.replace('    generateTerrain(chunk);\n    generateTrees(chunk);\n    chunk.generated = true;', '    generateTerrain(chunk);\n    generateTrees(chunk);\n    applyWorldOverridesToChunk(chunk);\n    chunk.generated = true;', 1)
          old = '''export function setBlockAt(x, y, z, type) {
              x = Math.floor(x);
              y = Math.floor(y);
              z = Math.floor(z);
              if (y < MIN_Y || y > WORLD_TOP) return false;

              const { chunkX, chunkZ, localX, localZ } = getChunkCoords(x, z);
              const chunk = getChunk(chunkX, chunkZ);
              if (!chunk) return false;
              chunk.blocks[blockIndex(localX, y, localZ)] = type;'''
          new = '''export function setBlockAt(x, y, z, type) {
              x = Math.floor(x);
              y = Math.floor(y);
              z = Math.floor(z);
              type = Math.floor(Number(type));
              if (![x, y, z, type].every(Number.isFinite)) return false;
              if (y < MIN_Y || y > WORLD_TOP) return false;

              worldOverrides.set(`${x},${y},${z}`, type);

              const { chunkX, chunkZ, localX, localZ } = getChunkCoords(x, z);
              const chunk = getChunk(chunkX, chunkZ);
              if (!chunk) return true;
              chunk.blocks[blockIndex(localX, y, localZ)] = type;'''
          s = s.replace(old, new, 1)
          s = s.replace('    queuedKeys.clear();\n    lastPlayerChunkX = Infinity;', '    queuedKeys.clear();\n    worldOverrides.clear();\n    lastPlayerChunkX = Infinity;', 1)
          world.write_text(s)

          client = Path('src/multiplayerClient.js')
          s = client.read_text()
          old = '''} else if (message.type === "block_change") {
              queueWorldChange(message);
          }'''
          new = '''} else if (message.type === "block_change") {
              queueWorldChange(message);
              applyPendingWorldChanges();
          }'''
          s = s.replace(old, new, 1)
          client.write_text(s)
          print('patched')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world.js src/multiplayerClient.js
          git diff --cached --quiet && exit 0
          git commit -m "LIVE: Sync world changes immediately"
          git push