<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <title>WebMinecraft</title>
    <style>
        @font-face {
            font-family: "MinecraftFont";
            src: url("./Minecraft.ttf") format("truetype");
            font-display: swap;
        }

        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
        body { font-family:Arial,sans-serif; }
        button, select, input { font:inherit; }

        /* Main menu */
        #mainMenu {
            position:fixed;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.36));
            z-index:80;
            pointer-events:auto;
            isolation:isolate;
        }
        #mainMenu::before {
            content:"";
            position:absolute;
            inset:0;
            background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.06), transparent 34%), linear-gradient(to bottom, transparent 35%, rgba(0,0,0,.25));
            pointer-events:none;
            z-index:-1;
        }
        #mainMenu::after {
            content:"";
            position:absolute;
            inset:-10px;
            background:rgba(10,14,18,.05);
            backdrop-filter:blur(1.5px);
            -webkit-backdrop-filter:blur(1.5px);
            pointer-events:none;
            z-index:-2;
        }
        #menuPanel {
            position:relative;
            width:min(430px, 92vw);
            margin-top:-18px;
            text-align:center;
            color:white;
            z-index:2;
        }
        #menuTitle {
            margin:0;
            font-family:"MinecraftFont", monospace;
            font-size:clamp(58px, 8vw, 78px);
            line-height:.9;
            letter-spacing:-2.5px;
            color:#fff;
            -webkit-text-stroke:2px #171717;
            text-shadow:
                3px 3px 0 #111,
                6px 6px 0 #080808,
                10px 10px 14px rgba(0,0,0,.8);
            transform:scaleX(1.04);
        }
        #menuSubtitle {
            margin:9px 0 18px;
            font-family:"MinecraftFont", monospace;
            font-size:11px;
            color:rgba(255,255,255,.82);
            letter-spacing:1px;
            text-shadow:2px 2px 0 #222;
        }
        #menuSplash {
            display:inline-block;
            min-height:24px;
            max-width:90%;
            margin:0 0 18px;
            padding:5px 10px;
            color:#fff51c;
            font-family:"MinecraftFont", monospace;
            font-size:16px;
            line-height:1.15;
            white-space:normal;
            text-shadow:2px 2px 0 #463e00, 3px 3px 0 #000;
            transform:rotate(-3deg);
        }
        #menuButtons {
            width:min(250px, 88vw);
            margin:0 auto;
        }
        .menuButton {
            display:block;
            width:100%;
            height:42px;
            margin:8px 0;
            padding:6px 10px 9px;
            border:2px solid #111;
            border-top-color:#bcbcbc;
            border-left-color:#bcbcbc;
            border-radius:2px;
            background:linear-gradient(#737373, #5b5b5b);
            color:#fff;
            font-family:"MinecraftFont", monospace;
            font-size:15px;
            line-height:1;
            letter-spacing:.2px;
            text-shadow:2px 2px 0 #333;
            cursor:pointer;
            box-shadow:
                inset 2px 2px 0 rgba(255,255,255,.14),
                inset -2px -3px 0 rgba(0,0,0,.3),
                0 3px 0 rgba(0,0,0,.72);
            image-rendering:pixelated;
            transition:filter .08s ease, transform .08s ease;
        }
        .menuButton:hover,
        .menuButton:focus-visible {
            background:linear-gradient(#858585, #686868);
            outline:2px solid rgba(255,255,255,.85);
            outline-offset:1px;
            filter:brightness(1.08);
        }
        .menuButton:active {
            background:#4f4f4f;
            border-top-color:#111;
            border-left-color:#111;
            border-right-color:#aaa;
            border-bottom-color:#aaa;
            transform:translateY(2px);
            box-shadow:inset 2px 2px 0 rgba(0,0,0,.35);
        }
        #playButton {
            background:linear-gradient(#7d7d7d, #616161);
        }
        #menuSettingsButton { margin-top:12px; }
        #mobileModeButton { margin-top:8px; }
        #menuFooter {
            position:fixed;
            left:9px;
            bottom:7px;
            text-align:left;
            color:#fff;
            font-family:"MinecraftFont", monospace;
            font-size:10px;
            line-height:1.4;
            text-shadow:2px 2px 0 #222;
            z-index:2;
        }
        #menuCopyright {
            position:fixed;
            right:9px;
            bottom:7px;
            color:rgba(255,255,255,.92);
            font-family:Arial,sans-serif;
            font-size:10px;
            text-shadow:1px 1px 0 #222;
            z-index:2;
        }

        #crosshair {
            position:fixed;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            color:white;
            font-size:22px;
            font-weight:bold;
            pointer-events:none;
            text-shadow:1px 1px 2px black,-1px -1px 2px black;
            z-index:10;
        }
        #hotbar {
            position:fixed;
            bottom:20px;
            left:50%;
            transform:translateX(-50%);
            display:flex;
            gap:4px;
            padding:5px;
            background:rgba(0,0,0,.55);
            border:2px solid rgba(255,255,255,.28);
            pointer-events:none;
            z-index:12;
        }
        .slot {
            width:48px;
            height:48px;
            flex:0 0 48px;
            border:2px solid #777;
            background:rgba(30,30,30,.82);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:11px;
            box-sizing:border-box;
            text-align:center;
        }
        .slot.selected { border:3px solid white; background:rgba(105,105,105,.86); }

        #settingsButton {
            position:fixed;
            top:20px;
            right:20px;
            width:48px;
            height:48px;
            border:2px solid #111;
            border-top-color:#888;
            border-left-color:#888;
            border-radius:3px;
            background:#4c4c4c;
            color:white;
            font-size:24px;
            cursor:pointer;
            z-index:90;
            box-shadow:0 3px 0 #171717;
        }
        #settingsButton:hover { background:#5e5e5e; }

        #settingsMenu {
            position:fixed;
            inset:0;
            display:none;
            align-items:center;
            justify-content:center;
            padding:18px;
            background:rgba(0,0,0,.68);
            z-index:100;
            pointer-events:auto;
        }
        #settingsPanel {
            width:min(450px, calc(100vw - 30px));
            max-height:88vh;
            overflow:auto;
            padding:24px;
            background:#252525;
            border:2px solid #111;
            border-top-color:#777;
            border-left-color:#777;
            color:white;
            box-shadow:0 10px 40px rgba(0,0,0,.6);
        }
        #settingsPanel h1 {
            margin:0 0 24px;
            font-family:"MinecraftFont", monospace;
            font-size:25px;
            text-shadow:2px 2px 0 #000;
        }
        .setting {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:18px;
            margin-bottom:17px;
            padding-bottom:14px;
            border-bottom:1px solid #444;
        }
        .setting label { font-size:16px; }
        .setting small { display:block; margin-top:3px; color:#999; font-size:11px; }
        select { min-width:125px; background:#333; color:white; border:1px solid #666; padding:7px 10px; border-radius:2px; }
        input[type="range"] { width:150px; accent-color:#84ad5e; }
        #closeSettings {
            width:100%;
            margin-top:6px;
            padding:12px;
            border:2px solid #111;
            border-top-color:#777;
            border-left-color:#777;
            background:#555;
            color:white;
            font-family:"MinecraftFont", monospace;
            cursor:pointer;
        }
        #closeSettings:hover { background:#666; }

        @media (max-width:900px) {
            #settingsButton { top:max(12px, env(safe-area-inset-top)); right:12px; }
            #menuPanel { margin-top:-7px; }
            #menuTitle { font-size:clamp(46px, 13vw, 62px); }
            #menuSubtitle { font-size:10px; margin-bottom:14px; }
            #menuSplash { font-size:14px; margin-bottom:14px; }
            #menuButtons { width:min(300px, 88vw); }
            .menuButton { height:45px; font-size:16px; margin:9px auto; }
        }

        body.mobile-mode #hotbar {
            pointer-events:auto;
            bottom:154px;
            max-width:calc(100vw - 20px);
            overflow-x:auto;
            scrollbar-width:none;
        }
        body.mobile-mode #hotbar::-webkit-scrollbar { display:none; }
        body.mobile-mode .slot { flex:0 0 48px; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.185.1/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="mainMenu">
        <div id="menuPanel">
            <h1 id="menuTitle">MINECRAFT</h1>
            <div id="menuSubtitle">WEB EDITION</div>
            <div id="menuSplash">Loading tip...</div>
            <div id="menuButtons">
                <button id="playButton" class="menuButton">Singleplayer</button>
                <button id="multiplayerButton" class="menuButton">Multiplayer</button>
                <button id="realmsButton" class="menuButton">Minecraft Realms</button>
                <button id="menuSettingsButton" class="menuButton">Options...</button>
                <button id="mobileModeButton" class="menuButton">Mobile Mode</button>
            </div>
        </div>
    </div>

    <div id="menuFooter">WebMinecraftT<br>v1.0</div>
    <div id="menuCopyright">WebMinecraftT</div>

    <div id="crosshair">+</div>
    <div id="hotbar">
        <div class="slot selected">1<br>Grass</div>
        <div class="slot">2<br>Dirt</div>
        <div class="slot">3<br>Stone</div>
        <div class="slot">4<br>Sand</div>
        <div class="slot">5<br>Oak</div>
        <div class="slot">6<br>Leaves</div>
        <div class="slot">7<br>Grass</div>
        <div class="slot">8<br>Dirt</div>
        <div class="slot">9<br>Stone</div>
    </div>

    <button id="settingsButton" aria-label="Settings">⚙</button>

    <div id="settingsMenu">
        <div id="settingsPanel">
            <h1>Settings</h1>
            <div class="setting"><div><label>Shadows</label><small>Dynamic sun shadows</small></div><input id="shadowsToggle" type="checkbox"></div>
            <div class="setting"><div><label>Shadow Quality</label><small>Higher = sharper shadows</small></div><select id="shadowQuality"><option value="512">Low</option><option value="1024">Medium</option><option value="2048">High</option><option value="4096">Ultra</option></select></div>
            <div class="setting"><div><label>Lighting Quality</label><small>Controls ambient light and shadow softness</small></div><select id="lightingQuality"><option value="performance">Performance</option><option value="balanced">Balanced</option><option value="high">High</option></select></div>
            <div class="setting"><div><label>Brightness</label><small>Overall scene exposure</small></div><input id="brightnessControl" type="range" min="0.65" max="1.35" step="0.05" value="1"></div>
            <div class="setting"><div><label>Graphics Quality</label><small>Render resolution scale</small></div><select id="pixelQuality"><option value="0.75">Low</option><option value="1" selected>Medium</option><option value="1.5">High</option></select></div>
            <button id="closeSettings">Done</button>
        </div>
    </div>

    <script>
        const menuTips = [
            "Never dig straight down!",
            "Watch your step around cliffs.",
            "Trees are a great early source of wood.",
            "You can sprint while moving forward.",
            "Caves can hide valuable ores.",
            "Water can save you from a long fall.",
            "Keep some blocks handy for building.",
            "A good shelter is better than no shelter.",
            "Explore different biomes to find new terrain.",
            "You can fly with F.",
            "Leaves make trees look much better with texture.",
            "Sometimes the best view is from a mountain."
        ];
        const menuSplash = document.getElementById("menuSplash");
        if (menuSplash) menuSplash.textContent = menuTips[Math.floor(Math.random() * menuTips.length)];
    </script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
