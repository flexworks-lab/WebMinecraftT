<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WebMinecraft</title>
    <style>
        @font-face {
            font-family: "MinecraftFont";
            src: url("./Minecraft.ttf") format("truetype");
            font-display: swap;
        }

        :root { color-scheme: dark; }
        * { box-sizing:border-box; }
        html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
        body { font-family:Arial,sans-serif; }
        button, select, input { font:inherit; }

        #mainMenu {
            position:fixed;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.48));
            z-index:80;
            pointer-events:auto;
        }
        #menuPanel {
            width:min(440px, calc(100vw - 36px));
            padding:24px 34px 28px;
            text-align:center;
            color:white;
            background:rgba(0,0,0,.20);
        }
        #menuTitle {
            margin:0 0 10px;
            font-family:"MinecraftFont", monospace;
            font-size:clamp(48px, 8vw, 72px);
            line-height:1;
            letter-spacing:1px;
            color:#fff;
            text-shadow:5px 5px 0 #202020, 8px 8px 12px rgba(0,0,0,.55);
        }
        #menuSubtitle {
            margin:0 0 24px;
            color:#ececec;
            font-family:"MinecraftFont", monospace;
            font-size:13px;
            text-shadow:2px 2px 0 #202020;
        }
        .menuButton {
            display:block;
            width:100%;
            min-height:52px;
            margin:10px 0;
            padding:12px 16px;
            border:2px solid #111;
            border-top-color:#8b8b8b;
            border-left-color:#8b8b8b;
            border-radius:2px;
            background:linear-gradient(#646464,#4b4b4b);
            color:#fff;
            font-family:"MinecraftFont", monospace;
            font-size:17px;
            line-height:1;
            text-shadow:2px 2px 0 #292929;
            cursor:pointer;
            box-shadow:0 3px 0 #181818, inset 0 1px 0 rgba(255,255,255,.16);
        }
        .menuButton:hover { background:linear-gradient(#777,#5a5a5a); }
        .menuButton:active { transform:translateY(2px); box-shadow:0 1px 0 #181818, inset 0 1px 0 rgba(255,255,255,.10); }
        #playButton { background:linear-gradient(#79a84b,#5f8c37); }
        #playButton:hover { background:linear-gradient(#8bbc59,#6b9e3e); }
        #menuVersion {
            margin-top:20px;
            color:#ddd;
            font-family:"MinecraftFont", monospace;
            font-size:10px;
            text-shadow:1px 1px 0 #222;
        }

        #crosshair {
            position:fixed;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            color:white;
            font-size:22px;
            font-weight:bold;
            pointer-events:none;
            text-shadow:1px 1px 2px black,-1px -1px 2px black;
            z-index:10;
        }
        #hotbar {
            position:fixed;
            bottom:20px;
            left:50%;
            transform:translateX(-50%);
            display:flex;
            gap:4px;
            padding:5px;
            background:rgba(0,0,0,.55);
            border:2px solid rgba(255,255,255,.28);
            pointer-events:none;
            z-index:12;
        }
        .slot {
            width:48px;
            height:48px;
            flex:0 0 48px;
            border:2px solid #777;
            background:rgba(30,30,30,.82);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:11px;
            box-sizing:border-box;
            text-align:center;
        }
        .slot.selected { border:3px solid white; background:rgba(105,105,105,.86); }

        #settingsButton {
            position:fixed;
            top:20px;
            right:20px;
            width:48px;
            height:48px;
            border:2px solid #111;
            border-top-color:#888;
            border-left-color:#888;
            border-radius:3px;
            background:#4c4c4c;
            color:white;
            font-size:24px;
            cursor:pointer;
            z-index:90;
            box-shadow:0 3px 0 #171717;
        }
        #settingsButton:hover { background:#5e5e5e; }

        #settingsMenu {
            position:fixed;
            inset:0;
            display:none;
            align-items:center;
            justify-content:center;
            padding:18px;
            background:rgba(0,0,0,.68);
            z-index:100;
            pointer-events:auto;
        }
        #settingsPanel {
            width:min(450px, calc(100vw - 30px));
            max-height:88vh;
            overflow:auto;
            padding:24px;
            background:#252525;
            border:2px solid #111;
            border-top-color:#777;
            border-left-color:#777;
            color:white;
            box-shadow:0 10px 40px rgba(0,0,0,.6);
        }
        #settingsPanel h1 {
            margin:0 0 24px;
            font-family:"MinecraftFont", monospace;
            font-size:25px;
            text-shadow:2px 2px 0 #000;
        }
        .setting {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:18px;
            margin-bottom:17px;
            padding-bottom:14px;
            border-bottom:1px solid #444;
        }
        .setting label { font-size:16px; }
        .setting small { display:block; margin-top:3px; color:#999; font-size:11px; }
        select { min-width:125px; background:#333; color:white; border:1px solid #666; padding:7px 10px; border-radius:2px; }
        input[type="range"] { width:150px; accent-color:#84ad5e; }
        #closeSettings {
            width:100%;
            margin-top:6px;
            padding:12px;
            border:2px solid #111;
            border-top-color:#777;
            border-left-color:#777;
            background:#555;
            color:white;
            font-family:"MinecraftFont", monospace;
            cursor:pointer;
        }
        #closeSettings:hover { background:#666; }

        @media (max-width:900px) {
            #settingsButton { top:max(12px, env(safe-area-inset-top)); right:12px; }
            #menuPanel { padding:18px 24px 24px; }
            #menuSubtitle { font-size:11px; }
        }

        body.mobile-mode #hotbar {
            pointer-events:auto;
            bottom:154px;
            max-width:calc(100vw - 20px);
            overflow-x:auto;
            scrollbar-width:none;
        }
        body.mobile-mode #hotbar::-webkit-scrollbar { display:none; }
        body.mobile-mode .slot { flex:0 0 48px; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.185.1/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="mainMenu">
        <div id="menuPanel">
            <h1 id="menuTitle">WebMinecraft</h1>
            <div id="menuSubtitle">A Minecraft-style world in your browser</div>
            <button id="playButton" class="menuButton">Play</button>
            <button id="menuSettingsButton" class="menuButton">Settings</button>
            <button id="mobileModeButton" class="menuButton">Mobile Mode</button>
            <div id="menuVersion">WebMinecraft</div>
        </div>
    </div>

    <div id="crosshair">+</div>
    <div id="hotbar">
        <div class="slot selected">1<br>Grass</div>
        <div class="slot">2<br>Dirt</div>
        <div class="slot">3<br>Stone</div>
        <div class="slot">4<br>Sand</div>
        <div class="slot">5<br>Oak</div>
        <div class="slot">6<br>Leaves</div>
        <div class="slot">7<br>Grass</div>
        <div class="slot">8<br>Dirt</div>
        <div class="slot">9<br>Stone</div>
    </div>

    <button id="settingsButton" aria-label="Settings">⚙</button>

    <div id="settingsMenu">
        <div id="settingsPanel">
            <h1>Settings</h1>
            <div class="setting"><div><label>Shadows</label><small>Dynamic sun shadows</small></div><input id="shadowsToggle" type="checkbox"></div>
            <div class="setting"><div><label>Shadow Quality</label><small>Higher = sharper shadows</small></div><select id="shadowQuality"><option value="512">Low</option><option value="1024">Medium</option><option value="2048">High</option><option value="4096">Ultra</option></select></div>
            <div class="setting"><div><label>Lighting Quality</label><small>Controls ambient light and shadow softness</small></div><select id="lightingQuality"><option value="performance">Performance</option><option value="balanced">Balanced</option><option value="high">High</option></select></div>
            <div class="setting"><div><label>Brightness</label><small>Overall scene exposure</small></div><input id="brightnessControl" type="range" min="0.65" max="1.35" step="0.05" value="1"></div>
            <div class="setting"><div><label>Graphics Quality</label><small>Render resolution scale</small></div><select id="pixelQuality"><option value="0.75">Low</option><option value="1" selected>Medium</option><option value="1.5">High</option></select></div>
            <button id="closeSettings">Done</button>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
